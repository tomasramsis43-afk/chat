<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>سالم | شات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">س</div>
      <h1>سالم</h1>
      <p class="tagline">شبكة صغيرة، محادثات حقيقية</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">دخول</button>
      <button class="tab-btn" data-tab="register">حساب جديد</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="الاسم" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="كلمة المرور" autocomplete="current-password" required>
      <p class="error-text" id="login-error"></p>
      <button type="submit" class="primary-btn">دخول</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" id="register-username" placeholder="اختار اسم مستخدم" autocomplete="username" required>
      <input type="password" id="register-password" placeholder="كلمة مرور (4 أحرف فأكتر)" autocomplete="new-password" required>
      <p class="error-text" id="register-error"></p>
      <button type="submit" class="primary-btn">إنشاء الحساب</button>
    </form>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen" class="screen hidden">

  <!-- Members list view -->
  <div id="members-view" class="view">
    <header class="top-bar">
      <div class="me">
        <div class="avatar" id="my-avatar"></div>
        <span id="my-name"></span>
      </div>
      <button id="logout-btn" class="icon-btn" title="خروج">⏻</button>
    </header>
    <div class="section-label">الأعضاء</div>
    <ul id="members-list" class="members-list"></ul>
    <p id="no-members" class="empty-state hidden">لسه محدش انضم غيرك. ابعت اللينك لصحابك.</p>
  </div>

  <!-- Conversation view -->
  <div id="chat-view" class="view hidden">
    <header class="top-bar chat-header">
      <button id="back-btn" class="icon-btn">→</button>
      <div class="avatar small" id="chat-avatar"></div>
      <div class="chat-header-info">
        <span id="chat-username"></span>
        <span id="chat-status" class="status-text"></span>
      </div>
    </header>
    <div id="messages" class="messages"></div>
    <div id="typing-indicator" class="typing-indicator hidden">بيكتب...</div>
    <form id="message-form" class="message-bar">
      <input type="text" id="message-input" placeholder="اكتب رسالة..." autocomplete="off">
      <button type="submit" class="send-btn">↑</button>
    </form>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
